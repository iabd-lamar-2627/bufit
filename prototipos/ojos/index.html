<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bufit · Ojos</title>
<style>
  :root {
    --fondo: #101923;
    --blanco: #f4f8ff;
    --brillo: rgba(103, 184, 255, .65);
    --pupila: #0c1522;
    --acento: #8fc8ff;
    --ancho: min(22vw, 34vh);            /* ancho del globo ocular; todo lo demás se mide con él */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fondo); overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #d8e6f3; }

  /* ---------------------------------------------------------------- cara
     Cada ojo tiene:
       .ceja        → arco blanco encima (sube, baja y se inclina según el estado)
       .globo       → óvalo blanco con brillo; dentro van la pupila y los párpados
       .pupila      → óvalo oscuro con reflejo; se mueve con la mirada
       Los párpados son una máscara sobre el globo: así el brillo sigue la forma recortada.
     Variables que cambia cada estado (números sin unidad, en "anchos de ojo"):
       --cy, --cx  → altura de la ceja y cuánto se separa hacia fuera (negativo: hacia el centro)
       --cr        → inclinación de la ceja (positivo: la punta de dentro baja, ceño; negativo: sube)
       --cs        → tamaño de la ceja
       --px, --py  → hacia dónde mira la pupila por el estado
       --ps, --pr  → cuánto baja el párpado superior (%) y su inclinación
       --sonrisa   → cuánto sube el párpado inferior curvo (%; 0 = no se ve)
     La mirada de la persona (ratón o cámara) llega en --mx y --my, de -1 a 1. */
  body { display: grid; grid-template-rows: minmax(0, 1fr) auto; }
  .cara { position: relative; display: grid; place-items: center;
    --mx: 0; --my: 0; }

  .ojos { display: flex; gap: calc(var(--ancho) * .55);
    transform: translate(calc(var(--mx) * var(--ancho) * .08), calc(var(--my) * var(--ancho) * .05));
    transition: transform .3s ease-out; }

  .ojo { position: relative;
    --cy: 0; --cx: 0; --cr: 0deg; --cs: 1; --px: .08; --py: .065; --ps: 0%; --pr: 0deg; --sonrisa: 0%; --escala: 1; --alto: 1.04; --tam-pupila: 1; }

  /* La posición de la ceja sigue al estado y a la mirada.
     El SVG interior se anima por separado para sumar los gestos a esa posición. */
  .ceja { position: absolute; left: 46%; bottom: 100%;
    margin-bottom: calc(var(--ancho) * .1);
    width: calc(var(--ancho) * .54); height: calc(var(--ancho) * .31);
    filter: drop-shadow(0 0 calc(var(--ancho) * .045) var(--brillo));
    transform: translateX(-50%)
      translate(calc((var(--cx) * var(--lado) + var(--mx) * .075) * var(--ancho)),
        calc((var(--cy) + var(--my) * .09) * var(--ancho)))
      rotate(calc(var(--cr) * var(--lado) * -1)) scale(var(--cs));
    transition: transform .34s cubic-bezier(.22, .8, .28, 1);
  }
  .izq { --lado: -1; }
  .der { --lado: 1; }
  .cara.espera .der, .cara.atento .der, .cara.contento .der { --px: -.08; }
  .der .ceja { left: 54%; }
  .ceja svg { display: block; width: 100%; height: 100%; overflow: visible;
    transform-box: border-box; transform-origin: center; }
  .ceja path { fill: var(--blanco); }

  @property --ps { syntax: '<percentage>'; inherits: true; initial-value: 0%; }
  @property --pr { syntax: '<angle>'; inherits: true; initial-value: 0deg; }
  @property --sonrisa { syntax: '<percentage>'; inherits: true; initial-value: 0%; }

  .globo { position: relative; overflow: hidden;
    width: var(--ancho); height: calc(var(--ancho) * var(--alto));
    border-radius: 55% 48% 38% 44% / 60% 58% 43% 42%;
    background: radial-gradient(ellipse at 50% 45%, var(--blanco) 55%, #d6e6f7 100%);
    transform: scale(var(--escala)); transform-origin: 50% 50%;
    --mascara:
      linear-gradient(calc(180deg + var(--pr)), transparent var(--ps), #000 calc(var(--ps) + 1%)),
      radial-gradient(ellipse 80% var(--sonrisa) at 50% 104%, transparent 98%, #000 100%);
    -webkit-mask-image: var(--mascara); -webkit-mask-composite: source-in;
    mask-image: var(--mascara); mask-composite: intersect;
    transition: height .35s cubic-bezier(.3, 1.4, .5, 1), transform .35s cubic-bezier(.3, 1.4, .5, 1),
      --ps .35s ease, --pr .35s ease, --sonrisa .45s ease; }
  .der .globo { border-radius: 48% 55% 44% 38% / 58% 60% 42% 43%;
    --mascara:
      linear-gradient(calc(180deg - var(--pr)), transparent var(--ps), #000 calc(var(--ps) + 1%)),
      radial-gradient(ellipse 80% var(--sonrisa) at 50% 104%, transparent 98%, #000 100%); }
  .globo.cerrando { animation: parpadeo .17s ease-in-out; }
  @keyframes parpadeo { 0%,100% { scale: 1 1; } 50% { scale: 1 .06; } }

  .pupila { position: absolute; left: 50%; top: 50%;
    width: calc(var(--ancho) * .5 * var(--tam-pupila)); height: calc(var(--ancho) * .68 * var(--tam-pupila));
    border-radius: 50%; background: var(--pupila);
    box-shadow: inset 0 0 0 calc(var(--ancho) * .02) #1f3550;
    transform: translate(-50%, -50%)
      translate(calc((var(--px) + var(--mx) * .2) * var(--ancho)), calc((var(--py) + var(--my) * .16) * var(--ancho)));
    transition: transform .25s ease-out, width .35s, height .35s, opacity .3s; }
  .pupila::after { content: ""; position: absolute; left: 25%; top: 17%;
    width: 25%; height: 20%; border-radius: 50%; background: #fff; }


  /* ---------------------------------------------------------------- estados */

  /* espera: tranquilo */
  .cara.espera .ojo { --cy: 0; }

  /* atento: cejas arriba, ojos un poco más grandes, pupilas abiertas */
  .cara.atento .ojo { --cy: -.1; --cs: 1.06; --cr: -3deg; --escala: 1.06; --tam-pupila: 1.08; }

  /* pensando: mira arriba a un lado, una ceja sube y la otra baja, párpados entornados */
  .cara.pensando .ojo { --px: .14; --py: -.17; --ps: 14%; --tam-pupila: .9; }
  .cara.pensando .izq { --cy: -.16; --cs: 1.08; --cr: -8deg; }
  .cara.pensando .der { --cy: .04; --cs: .92; --cr: 10deg; --cx: -.03; }
  .cara.pensando .pupila { animation: pensar 2.4s ease-in-out infinite; }
  @keyframes pensar { 0%,100% { translate: 0 0; } 50% { translate: calc(var(--ancho) * -.1) 0; } }

  /* sorprendido: cejas muy altas, ojos grandes y redondos, pupila pequeña */
  .cara.sorprendido .ojo { --cy: -.24; --cs: 1.15; --cr: -4deg; --cx: .03; --escala: 1.12; --alto: 1.05; --tam-pupila: .72; }

  /* contento: el párpado de abajo sube curvo y deja el ojo en arco ( ^ ^ ) */
  .cara.contento .ojo { --cy: -.1; --cs: 1.04; --cr: -6deg; --cx: .03; --sonrisa: 62%; --py: -.08; }
  .cara.contento { --brillo: rgba(160, 255, 210, .5); }

  /* dudoso: una ceja alta e inclinada, la otra baja; un ojo entornado; mira de lado */
  .cara.dudoso .ojo { --px: -.12; --py: .03; }
  .cara.dudoso .izq { --cy: -.2; --cs: 1.12; --cr: -12deg; }
  .cara.dudoso .der { --cy: .07; --cs: .88; --cr: 12deg; --cx: -.04; --ps: 34%; --pr: 6deg; }
  .cara.dudoso { --brillo: rgba(255, 215, 140, .5); }

  /* dormido: ojos cerrados como una línea, cejas relajadas, respiración lenta y zetas */
  .cara.dormido .ojo { --cy: .12; --cs: .92; --cr: -4deg; --alto: .07; }
  .cara.dormido .ceja { opacity: .8; margin-bottom: calc(var(--ancho) * .31); }
  .cara.dormido .pupila { opacity: 0; }
  .cara.dormido .ojos { animation: respirar 4s ease-in-out infinite; }
  @keyframes respirar { 0%,100% { scale: 1; } 50% { scale: 1.04; } }

  /* escuchando: sostiene la mirada y levanta una ceja al empezar */
  .cara.escuchando .ojo { --px: 0; --py: 0; --ps: 5%; }
  .cara.escuchando .izq { --cy: -.12; --cr: -7deg; }
  .cara.escuchando .der { --cy: -.035; --cr: -2deg; }

  /* concentrado: fija la mirada abajo y acerca las cejas */
  .cara.concentrado .ojo {
    --px: 0; --py: .16; --ps: 24%; --pr: 5deg;
    --cy: .09; --cx: -.07; --cr: 13deg; --tam-pupila: .9;
  }

  /* Señales de turno y de ayuda durante la partida. */
  .cara.tu_turno .ojo { --px: 0; --py: -.08; --cy: -.07; --escala: 1.04; }
  .cara.repiteme .ojo { --px: 0; --py: -.025; }
  .cara.repiteme .der { --cy: -.14; --cr: -14deg; }
  .cara.repiteme .izq { --cy: .035; --cr: 7deg; --ps: 12%; }
  .cara.busca_carta .ojo { --px: 0; --py: .01; --cy: -.045; }
  .cara.busca_carta .pupila { animation: indicar-bandeja 1.55s ease-in-out; }
  @keyframes indicar-bandeja {
    25%, 62% { translate: 0 calc(var(--ancho) * .17); }
  }

  .cara.escaneando .ojo {
    --px: 0; --py: .14; --ps: 16%; --cy: .04; --cx: -.035; --cr: 7deg;
  }
  .cara.escaneando .pupila { animation: escanear 4.8s ease-in-out infinite; }
  @keyframes escanear {
    0%, 8%, 100% { translate: calc(var(--ancho) * -.19); }
    50%, 58% { translate: calc(var(--ancho) * .19); }
  }

  .zetas { position: absolute; top: 16%; right: 22%; font-weight: 700; color: var(--blanco);
    opacity: 0; pointer-events: none; transition: opacity .6s; }
  .cara.dormido .zetas { opacity: 1; }
  .zetas span { position: absolute; animation: zeta 3s ease-in infinite; opacity: 0; }
  .zetas span:nth-child(1) { font-size: 4vmin; animation-delay: 0s; }
  .zetas span:nth-child(2) { font-size: 5.5vmin; animation-delay: 1s; }
  .zetas span:nth-child(3) { font-size: 7vmin; animation-delay: 2s; }
  @keyframes zeta { 0% { transform: translate(0, 0); opacity: 0; } 20% { opacity: .9; }
    100% { transform: translate(6vmin, -14vmin); opacity: 0; } }

  /* ---------------------------------------------------------------- botonera */
  .botonera { min-height: 90px; max-height: 45vh; overflow-y: auto; padding: 14px 16px;
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center;
    background: rgba(255,255,255,.04); border-top: 1px solid rgba(255,255,255,.08); }
  .botonera.oculta { display: none; }
  button { font: inherit; font-size: 15px; padding: 9px 16px; border-radius: 10px; cursor: pointer;
    background: #1b222c; color: #d8e6f3; border: 1px solid #2c3a4a; }
  button:hover { border-color: var(--acento); }
  button.activo { background: var(--acento); color: #0b1622; border-color: var(--acento); font-weight: 600; }
  .separador { width: 1px; height: 30px; background: rgba(255,255,255,.12); margin: 0 6px; }
  .ayuda { width: 100%; text-align: center; font-size: 12px; opacity: .55; }
  .mqtt { font-size: 12px; color: #888; padding: 4px 8px; border-radius: 10px; border: 1px solid #333; }
  .mqtt.ok { color: #7fe3a0; border-color: #2e6b45; }
  @media (prefers-reduced-motion: reduce) {
    .cara *, .cara *::after { transition-duration: 0s !important; }
    .cara.pensando .pupila, .cara.dormido .ojos, .zetas span,
    .cara.busca_carta .pupila, .cara.escaneando .pupila { animation: none; }
    .cara.busca_carta .ojo { --py: .14; }
    .zetas span:last-child { opacity: .9; }
  }
</style>
</head>
<body>

<div class="cara espera" id="cara">
  <div class="ojos">
    <div class="ojo izq">
      <div class="ceja"><svg viewBox="0 0 100 58" aria-hidden="true"><path d="M6 45 C13 22 45 3 76 5 C90 6 99 13 98 21 C97 29 90 32 80 30 C54 25 31 33 15 48 C9 54 3 52 6 45 Z"/></svg></div>
      <div class="marco"><div class="globo"><div class="pupila"></div></div></div>
    </div>
    <div class="ojo der">
      <div class="ceja"><svg viewBox="0 0 100 58" aria-hidden="true"><path d="M3 21 C2 13 10 7 23 6 C53 3 82 17 95 39 C101 49 94 53 86 47 C67 32 47 26 22 31 C11 33 4 29 3 21 Z"/></svg></div>
      <div class="marco"><div class="globo"><div class="pupila"></div></div></div>
    </div>
  </div>
  <div class="zetas"><span>z</span><span>z</span><span>Z</span></div>
</div>

<div class="botonera" id="botonera">
  <!-- los botones de estado se crean desde JavaScript -->
  <span class="separador"></span>
  <button id="btn-raton" title="La mirada sigue al ratón">Mirada: ratón</button>
  <button id="btn-parpadeo">Parpadear</button>
  <button id="btn-completa">Pantalla completa</button>
  <span class="mqtt" id="indicador-mqtt" title="Conexión con el broker MQTT">MQTT: desconectado</span>
  <div class="ayuda">1–9: estados · T: tu turno · R: repíteme · B: busca la carta · S: escanear · M: mirada con el ratón · H: ocultar botones · F: pantalla completa · espacio: parpadear</div>
</div>

<script src="mqtt.min.js"></script>
<script>
/* ================================================================
   Bufit · ojos
   Los estados se reciben por el contrato de Bufit (bufit/pantalla/set → "ojos").
   El orquestador llama a bufit.estado() y la cámara a bufit.mirar(), o llegan por MQTT.
   ================================================================ */
const ESTADOS = ["espera", "atento", "pensando", "sorprendido", "contento", "dudoso", "dormido", "escuchando", "concentrado",
  "tu_turno", "repiteme", "busca_carta", "escaneando"];
const TECLAS_ESTADO = { t: "tu_turno", r: "repiteme", b: "busca_carta", s: "escaneando" };
const NOMBRES_ESTADO = { tu_turno: "tu turno", repiteme: "repíteme", busca_carta: "busca la carta" };

const cara = document.getElementById("cara");
const globos = [...document.querySelectorAll(".globo")];
const cejas = [...document.querySelectorAll(".ceja svg")];
const movimientoReducido = matchMedia("(prefers-reduced-motion: reduce)");
const gestos = new Map();

function gestoCeja(ceja, altura, giro, duracion) {
  if (movimientoReducido.matches) return;
  gestos.get(ceja)?.cancel();
  const animacion = ceja.animate([
    { transform: "none" },
    { transform: `translateY(${altura}%) rotate(${giro}deg)`, offset: .42 },
    { transform: "none" },
  ], { duration: duracion, easing: "ease-in-out" });
  gestos.set(ceja, animacion);
}
let estadoActual = "espera";
let siguiendoRaton = false;
let pausaMiradaHasta = 0;   // mientras alguien de fuera (cámara, MQTT) dirige la mirada, no mira alrededor sola

/* ---------- estados */
function estado(nombre) {
  if (!ESTADOS.includes(nombre)) { console.warn("Estado desconocido:", nombre); return; }
  if (nombre !== estadoActual) {
    gestos.forEach(animacion => animacion.cancel());
    if (nombre === "atento") cejas.forEach(ceja => gestoCeja(ceja, -30, 0, 540));
    if (nombre === "sorprendido") cejas.forEach(ceja => gestoCeja(ceja, -36, 0, 460));
    if (nombre === "pensando") gestoCeja(cejas[0], -30, -6, 680);
    if (nombre === "contento") {
      gestoCeja(cejas[0], -32, -5, 550);
      gestoCeja(cejas[1], -32, 5, 650);
    }
    if (nombre === "tu_turno") cejas.forEach(ceja => gestoCeja(ceja, -32, 0, 520));
    if (nombre === "escaneando") cejas.forEach((ceja, i) => {
      gestoCeja(ceja, 14, i === 0 ? 4 : -4, 460);
    });
    if (nombre === "escuchando") gestoCeja(cejas[0], -22, -4, 550);
    if (nombre === "concentrado") cejas.forEach((ceja, i) => {
      gestoCeja(ceja, 14, i === 0 ? 4 : -4, 440);
    });
    if (nombre === "dudoso") gestoCeja(cejas[0], -36, -8, 720);
  }
  cara.classList.remove(...ESTADOS);
  if (nombre === estadoActual && nombre === "busca_carta") void cara.offsetWidth;
  cara.classList.add(nombre);
  estadoActual = nombre;
  if (nombre === "repiteme") parpadear();
  document.querySelectorAll("[data-estado]").forEach(b => b.classList.toggle("activo", b.dataset.estado === nombre));
}

/* ---------- mirada: x e y entre -1 (izquierda/arriba) y 1 (derecha/abajo) */
function mirar(x, y) {
  pausaMiradaHasta = Date.now() + 6000;
  aplicarMirada(x, y);
}

function aplicarMirada(x, y) {
  x = Math.max(-1, Math.min(1, x));
  y = Math.max(-1, Math.min(1, y));
  cara.style.setProperty("--mx", x);
  cara.style.setProperty("--my", y);
}

/* ---------- parpadeo */
function parpadear() {
  if (estadoActual === "dormido") return;
  globos.forEach(g => { g.classList.remove("cerrando"); void g.offsetWidth; g.classList.add("cerrando"); });
  cejas.forEach(ceja => {
    if (gestos.get(ceja)?.playState !== "running") gestoCeja(ceja, 12, 0, 170);
  });
}
// Parpadeo natural: cada 2,5–6 s, y a veces doble
(function parpadeoNatural() {
  setTimeout(() => {
    if (!document.hidden && !movimientoReducido.matches) {
      parpadear();
      if (Math.random() < .2) setTimeout(parpadear, 260);
    }
    parpadeoNatural();
  }, 2500 + Math.random() * 3500);
})();

// Gesto de cejas: cada 5–11 s, en reposo, sube una ceja (o las dos) un momento
(function gestoCejas() {
  setTimeout(() => {
    if (!document.hidden && (estadoActual === "espera" || estadoActual === "atento")) {
      const cuales = Math.random() < .25 ? cejas : [cejas[Math.floor(Math.random() * cejas.length)]];
      cuales.forEach(ceja => gestoCeja(ceja, -38, ceja === cejas[0] ? -8 : 8, 760));
    }
    gestoCejas();
  }, 5000 + Math.random() * 6000);
})();

// Pequeños movimientos de mirada en reposo, para que parezca vivo
(function mirarAlrededor() {
  setTimeout(() => {
    if (!document.hidden && !movimientoReducido.matches && !siguiendoRaton && Date.now() > pausaMiradaHasta && (estadoActual === "espera" || estadoActual === "atento")) {
      Math.random() < .35 ? aplicarMirada(0, 0) : aplicarMirada((Math.random() - .5) * 1.4, (Math.random() - .5) * .8);
    }
    mirarAlrededor();
  }, 1800 + Math.random() * 2500);
})();

/* ---------- botonera */
const botonera = document.getElementById("botonera");
ESTADOS.slice().reverse().forEach((nombre, i) => {
  const b = document.createElement("button");
  const atajo = Object.keys(TECLAS_ESTADO).find(tecla => TECLAS_ESTADO[tecla] === nombre);
  b.textContent = `${atajo?.toUpperCase() ?? ESTADOS.length - i} · ${NOMBRES_ESTADO[nombre] ?? nombre}`;
  b.dataset.estado = nombre;
  b.onclick = () => estado(nombre);
  botonera.prepend(b);
});

const btnRaton = document.getElementById("btn-raton");
function alternarRaton() {
  siguiendoRaton = !siguiendoRaton;
  btnRaton.classList.toggle("activo", siguiendoRaton);
  if (!siguiendoRaton) mirar(0, 0);
}
btnRaton.onclick = alternarRaton;
document.addEventListener("mousemove", e => {
  if (siguiendoRaton) mirar((e.clientX / innerWidth) * 2 - 1, (e.clientY / innerHeight) * 2 - 1);
});
document.getElementById("btn-parpadeo").onclick = parpadear;
function pantallaCompleta() {
  document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
}
document.getElementById("btn-completa").onclick = pantallaCompleta;

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const n = parseInt(e.key, 10);
  const nombre = TECLAS_ESTADO[e.key.toLowerCase()] ?? ESTADOS[n - 1];
  if (nombre) estado(nombre);
  else if (e.key === "m" || e.key === "M") alternarRaton();
  else if (e.key === "h" || e.key === "H") {
    botonera.classList.toggle("oculta");
  }
  else if (e.key === "f" || e.key === "F") pantallaCompleta();
  else if (e.key === " ") parpadear();
});

/* ---------- lo que podrán usar las demás piezas de Bufit */
window.bufit = { estado, mirar, parpadear, ESTADOS };
estado("espera");

/* ---------- MQTT: los ojos obedecen los mensajes de bufit/pantalla/set
   Mensajes que entiende (JSON):
     {"ojos": "contento"}              cambia de estado
     {"mirar": {"x": 0.5, "y": -0.2}}  mueve la mirada (de -1 a 1)
     {"parpadear": true}               parpadea una vez
   Se pueden combinar en el mismo mensaje.
   Otro broker: abrir index.html?mqtt=ws://IP:9001 */
if (typeof window.mqtt?.connect === "function") {
  const TEMA = "bufit/pantalla/set";
  const urlBroker = new URLSearchParams(location.search).get("mqtt") || "ws://localhost:9001";
  const indicador = document.getElementById("indicador-mqtt");
  const cliente = mqtt.connect(urlBroker, { reconnectPeriod: 2000 });
  cliente.on("connect", () => {
    cliente.subscribe(TEMA);
    indicador.textContent = "MQTT: conectado";
    indicador.classList.add("ok");
  });
  cliente.on("close", () => {
    indicador.textContent = "MQTT: desconectado";
    indicador.classList.remove("ok");
  });
  cliente.on("message", (tema, datos) => {
    let m;
    try { m = JSON.parse(datos.toString()); } catch { console.warn("Mensaje no JSON:", datos.toString()); return; }
    if (m.ojos) estado(m.ojos);
    if (m.mirar) mirar(m.mirar.x ?? 0, m.mirar.y ?? 0);
    if (m.parpadear) parpadear();
  });
}
</script>
</body>
</html>
