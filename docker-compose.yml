# Bufit · servicios del sistema
#
# Arranque mínimo: el broker y los dos módulos de ejemplo.
#   docker compose up -d
#
# Según vayan estando listos los módulos, se descomentan sus bloques.

services:

  # ---------------------------------------------------------------- bus
  broker:
    image: eclipse-mosquitto:2
    container_name: bufit-broker
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped

  # ------------------------------------------------- servicios REST
  motor-reglas:
    build: ./modulos/motor-reglas
    container_name: bufit-motor-reglas
    ports:
      - "8001:8000"
    restart: unless-stopped

  # ------------------------------------------- suscriptores MQTT
  registro:
    build: ./modulos/registro
    container_name: bufit-registro
    environment:
      BROKER: broker
    volumes:
      - ./datos/trazas:/trazas
    depends_on:
      - broker
    restart: unless-stopped

  # ---------------------------------------------------------- pendientes
