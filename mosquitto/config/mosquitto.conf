# Bufit · configuración del broker
#
# Sin autenticación: el broker solo escucha dentro del equipo y de la red
# de Docker. Si algún día Bufit se conecta a una red ajena, hay que poner
# usuario y contraseña aquí.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Mantiene los mensajes retenidos entre reinicios del broker,
# que es lo que permite a un módulo recuperar el estado al arrancar.
autosave_interval 60
